name: 🐛 Bug report
description: Something in bees doesn't work as expected.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx bees init --tools claude
        2. ...
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool(s)
      multiple: true
      options: [Claude Code, GitHub Copilot, Cursor, Codex, bees CLI]
  - type: input
    id: version
    attributes:
      label: bees version & OS
      placeholder: "bees 0.1.0 · Windows 11"
